# Stock open-weights models run through the repo's abstention eval.
# Same prompts, same greedy decode, same classifier as the internal
# checkpoints — the only difference is no fine-tuning.

eval_parquet: data/processed/eval.parquet
results_dir: evals/results
report_md: EVAL_REPORT.md
max_new: 40

models:
